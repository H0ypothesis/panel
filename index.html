<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f3" />
    <script>
      // Apply both preferences before the app and its styles load.
      (() => {
        let preference;
        let palette;
        try {
          preference = localStorage.getItem("panel:theme");
          palette = localStorage.getItem("panel:palette");
        } catch {
          // System preference still works when browser storage is unavailable.
        }
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = dark ? "dark" : "light";
        const savedPalette = ["mono", "blue", "violet", "sand"].includes(
          palette,
        )
          ? palette
          : "green";
        const background =
          savedPalette === "green"
            ? dark
              ? "#151b18"
              : "#f5f6f3"
            : dark
              ? "#171717"
              : "#f5f5f5";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.palette = savedPalette;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = background;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", background);
      })();
    </script>
    <title>Panel · 让思考自由生长</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
